<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sync Player</title>
    <style>
        :root {
            --bg-0: #090d14;
            --bg-1: #0d131d;
            --panel: rgba(20, 28, 40, 0.72);
            --panel-strong: rgba(22, 31, 45, 0.9);
            --panel-soft: rgba(255, 255, 255, 0.035);
            --line: rgba(148, 163, 184, 0.14);
            --line-strong: rgba(148, 163, 184, 0.22);
            --text: #e8eef7;
            --text-soft: #98a6bb;
            --accent: #4f9cf9;
            --accent-2: #7ab7ff;
            --accent-soft: rgba(79, 156, 249, 0.14);
            --success: #5ed49a;
            --warning: #f4c96a;
            --danger: #ff7b89;
            --shadow: 0 24px 60px rgba(0, 0, 0, 0.34);
            --radius: 18px;
            --radius-sm: 12px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: var(--bg-0);
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 28px;
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at 12% 0%, rgba(62, 123, 214, 0.20), transparent 32%), radial-gradient(circle at 92% 8%, rgba(80, 110, 170, 0.14), transparent 28%), linear-gradient(145deg, var(--bg-0) 0%, var(--bg-1) 58%, #0a1018 100%);
            position: relative;
            overflow-x: hidden;
        }

            body::before,
            body::after {
                content: "";
                position: fixed;
                width: 280px;
                height: 280px;
                border-radius: 50%;
                pointer-events: none;
                filter: blur(70px);
                opacity: 0.12;
                z-index: 0;
            }

            body::before {
                top: 18%;
                left: -90px;
                background: #2f7be6;
            }

            body::after {
                right: -80px;
                bottom: 8%;
                background: #7b91b4;
            }

        button,
        input {
            font: inherit;
        }

        button {
            color: inherit;
        }

        #layout {
            width: min(1180px, 100%);
            margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 320px;
            gap: 18px;
            align-items: start;
            position: relative;
            z-index: 1;
        }

        #mainColumn,
        #queuePanel {
            background: linear-gradient(180deg, rgba(24, 33, 47, 0.78), rgba(13, 19, 29, 0.72));
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            backdrop-filter: blur(20px) saturate(145%);
            -webkit-backdrop-filter: blur(20px) saturate(145%);
        }

        #mainColumn {
            min-width: 0;
            border-radius: 22px;
            padding: 28px;
        }

            #mainColumn h1 {
                margin: 0;
                display: flex;
                align-items: center;
                gap: 10px;
                color: #f2f6fb;
                font-size: clamp(1.55rem, 2.8vw, 2.2rem);
                line-height: 1.1;
                letter-spacing: -0.025em;
            }

                #mainColumn h1::before {
                    content: "▶";
                    display: grid;
                    place-items: center;
                    width: 38px;
                    height: 38px;
                    border-radius: 11px;
                    color: #dcecff;
                    font-size: 14px;
                    background: linear-gradient(145deg, rgba(79, 156, 249, 0.95), rgba(57, 107, 174, 0.82));
                    box-shadow: 0 10px 26px rgba(38, 104, 189, 0.24), inset 0 1px rgba(255, 255, 255, 0.2);
                }

        #hostBadge {
            margin-left: 2px;
            padding: 6px 10px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.045);
            color: #9fb0c8;
            font-size: 0.52em;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        #status {
            margin: 10px 0 24px;
            color: var(--text-soft);
            font-size: 0.84rem;
        }

            #status::before {
                content: "";
                display: inline-block;
                width: 7px;
                height: 7px;
                margin-right: 8px;
                vertical-align: 1px;
                border-radius: 50%;
                background: var(--warning);
                box-shadow: 0 0 14px rgba(244, 201, 106, 0.55);
            }

        #transferHostBtn {
            width: 100%;
            margin: 0 0 14px;
            padding: 11px 14px;
            border: 1px solid rgba(244, 201, 106, 0.28);
            border-radius: var(--radius-sm);
            background: rgba(244, 201, 106, 0.08);
            color: #f8dc9b;
            font-size: 0.86rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: inset 0 1px rgba(255, 255, 255, 0.03);
            transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
        }

            #transferHostBtn:hover {
                transform: translateY(-1px);
                border-color: rgba(244, 201, 106, 0.42);
                background: rgba(244, 201, 106, 0.12);
            }

        #trackInfo {
            min-height: 110px;
            margin: 0 0 14px;
            padding: 20px 22px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(74, 140, 224, 0.11), rgba(255, 255, 255, 0.02) 45%), rgba(255, 255, 255, 0.028);
            border: 1px solid var(--line);
            border-radius: var(--radius);
        }

            #trackInfo::after {
                content: "";
                position: absolute;
                width: 160px;
                height: 160px;
                right: -70px;
                top: -70px;
                border-radius: 50%;
                background: radial-gradient(circle, rgba(96, 167, 250, 0.18), transparent 68%);
                pointer-events: none;
            }

        #trackTitle {
            position: relative;
            z-index: 1;
            font-size: clamp(1.05rem, 2vw, 1.35rem);
            font-weight: 700;
            letter-spacing: -0.01em;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #trackQueue {
            position: relative;
            z-index: 1;
            margin-top: 7px !important;
            color: #76869d !important;
            font-size: 0.76rem !important;
        }

        #seekRow {
            display: none;
            align-items: center;
            gap: 12px;
            margin: 14px 0 18px;
            color: #8fa0b8;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.74rem;
        }

            #seekRow.visible {
                display: flex;
            }

        #seekBar,
        #volumeBar {
            -webkit-appearance: none;
            appearance: none;
            min-width: 0;
            outline: none;
            cursor: pointer;
        }

        #seekBar {
            flex: 1;
            height: 5px;
            background: linear-gradient(90deg, rgba(79, 156, 249, 0.42), rgba(255, 255, 255, 0.1));
            border-radius: 999px;
        }

            #seekBar::-webkit-slider-thumb,
            #volumeBar::-webkit-slider-thumb {
                -webkit-appearance: none;
                appearance: none;
                border-radius: 50%;
                background: var(--accent);
                box-shadow: 0 0 0 5px rgba(79, 156, 249, 0.10), 0 2px 10px rgba(0, 0, 0, 0.28);
                transition: transform 0.12s ease, box-shadow 0.12s ease;
            }

            #seekBar::-webkit-slider-thumb {
                width: 15px;
                height: 15px;
            }

                #seekBar::-webkit-slider-thumb:hover,
                #volumeBar::-webkit-slider-thumb:hover {
                    transform: scale(1.18);
                    box-shadow: 0 0 0 6px rgba(79, 156, 249, 0.13), 0 4px 12px rgba(0, 0, 0, 0.3);
                }

            #seekBar::-moz-range-thumb,
            #volumeBar::-moz-range-thumb {
                border: 0;
                border-radius: 50%;
                background: var(--accent);
            }

            #seekBar:disabled {
                cursor: not-allowed;
                opacity: 0.48;
            }

                #seekBar:disabled::-webkit-slider-thumb {
                    background: #64748b;
                    box-shadow: none;
                }

        #volumeRow {
            display: none;
            align-items: center;
            gap: 12px;
            margin: 2px 0 18px;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.022);
            border: 1px solid var(--line);
            border-radius: 14px;
            color: #8fa0b8;
            font-size: 0.76rem;
        }

            #volumeRow button {
                width: 34px;
                height: 34px;
                flex: 0 0 auto;
                padding: 0;
                border: 1px solid transparent;
                border-radius: 10px;
                background: transparent;
                font-size: 17px;
                cursor: pointer;
                transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
            }

                #volumeRow button:hover {
                    background: rgba(255, 255, 255, 0.06);
                    border-color: var(--line);
                    transform: translateY(-1px);
                }

        #volumeBar {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.10);
            border-radius: 999px;
        }

            #volumeBar::-webkit-slider-thumb {
                width: 13px;
                height: 13px;
            }

        #volumeLabel {
            min-width: 48px;
            text-align: right;
            color: #91a0b7;
            font-variant-numeric: tabular-nums;
        }

        .controls {
            margin: 14px 0;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

            .controls input[type="text"] {
                flex: 1;
                min-width: 220px;
                height: 44px;
                padding: 0 14px;
                color: var(--text);
                background: rgba(5, 10, 17, 0.46);
                border: 1px solid var(--line-strong);
                border-radius: 12px;
                outline: none;
                box-shadow: inset 0 1px rgba(255, 255, 255, 0.025);
                transition: border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
            }

                .controls input[type="text"]::placeholder,
                .field input::placeholder {
                    color: #63728a;
                }

                .controls input[type="text"]:focus,
                .field input:focus {
                    border-color: rgba(79, 156, 249, 0.60);
                    background: rgba(6, 12, 20, 0.64);
                    box-shadow: 0 0 0 4px rgba(79, 156, 249, 0.09);
                }

            .controls button,
            .modal-actions button {
                min-height: 44px;
                padding: 0 15px;
                border: 1px solid var(--line-strong);
                border-radius: 12px;
                background: rgba(255, 255, 255, 0.045);
                color: #dce5f1;
                font-size: 0.84rem;
                font-weight: 600;
                cursor: pointer;
                box-shadow: inset 0 1px rgba(255, 255, 255, 0.035);
                transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
            }

                .controls button:hover,
                .modal-actions button:hover {
                    transform: translateY(-1px);
                    background: rgba(255, 255, 255, 0.075);
                    border-color: rgba(159, 179, 208, 0.32);
                }

                .controls button:active,
                .modal-actions button:active {
                    transform: translateY(0);
                }

        #searchBtn,
        #saveBtn {
            background: linear-gradient(180deg, rgba(79, 156, 249, 0.88), rgba(57, 123, 205, 0.86));
            border-color: rgba(122, 183, 255, 0.34);
            color: #f6fbff;
            box-shadow: 0 8px 22px rgba(52, 117, 201, 0.18), inset 0 1px rgba(255, 255, 255, 0.18);
        }

            #searchBtn:hover {
                background: linear-gradient(180deg, rgba(91, 166, 255, 0.95), rgba(61, 130, 216, 0.92));
                border-color: rgba(122, 183, 255, 0.46);
            }

        #searchModeToggle {
            display: inline-flex;
            flex: 0 0 auto;
            height: 44px;
            overflow: hidden;
            border: 1px solid var(--line-strong);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
        }

            #searchModeToggle button {
                min-height: 0;
                padding: 0 13px;
                border: none;
                border-radius: 0;
                background: transparent;
                color: #8190a7;
                font-size: 0.77rem;
                white-space: nowrap;
            }

                #searchModeToggle button:hover {
                    transform: none;
                    background: rgba(255, 255, 255, 0.045);
                    border: none;
                }

                #searchModeToggle button.active {
                    background: var(--accent-soft);
                    color: #a9d0ff;
                    box-shadow: inset 0 0 0 1px rgba(79, 156, 249, 0.17);
                }

                #searchModeToggle button + button {
                    border-left: 1px solid var(--line);
                }

        #searchRow,
        #playRow {
            display: none;
        }

            #searchRow.visible,
            #playRow.visible {
                display: flex;
            }

        #playRow {
            justify-content: center;
            gap: 10px;
            margin-top: 22px;
            padding-top: 16px;
            border-top: 1px solid var(--line);
        }

            #playRow button {
                width: 48px;
                height: 46px;
                min-height: 46px;
                padding: 0;
                border-radius: 14px;
                font-size: 16px;
            }

        #playBtn {
            width: 58px !important;
            background: linear-gradient(145deg, rgba(79, 156, 249, 0.96), rgba(50, 112, 191, 0.9)) !important;
            border-color: rgba(122, 183, 255, 0.35) !important;
            box-shadow: 0 10px 28px rgba(52, 117, 201, 0.22), inset 0 1px rgba(255, 255, 255, 0.20) !important;
        }

        #searchResults {
            display: none;
            max-height: 360px;
            margin: 8px 0 16px;
            overflow-y: auto;
            overflow-x: hidden;
            background: rgba(6, 11, 18, 0.65);
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: inset 0 1px rgba(255, 255, 255, 0.025);
        }

            #searchResults.visible {
                display: block;
            }

            #searchResults::-webkit-scrollbar,
            #queueList::-webkit-scrollbar {
                width: 8px;
            }

            #searchResults::-webkit-scrollbar-thumb,
            #queueList::-webkit-scrollbar-thumb {
                background: rgba(148, 163, 184, 0.18);
                border-radius: 999px;
            }

            #searchResults::-webkit-scrollbar-track,
            #queueList::-webkit-scrollbar-track {
                background: transparent;
            }

        .searchItem {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            cursor: pointer;
            border-bottom: 1px solid rgba(148, 163, 184, 0.08);
            transition: background 0.14s ease;
        }

            .searchItem:last-child {
                border-bottom: none;
            }

            .searchItem:hover {
                background: rgba(79, 156, 249, 0.075);
            }

            .searchItem img {
                width: 48px;
                height: 48px;
                flex-shrink: 0;
                object-fit: cover;
                border: 1px solid var(--line);
                border-radius: 10px;
                background: #182232;
            }

            .searchItem .info {
                flex: 1;
                min-width: 0;
            }

            .searchItem .title {
                color: #e9eff7;
                font-weight: 650;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .searchItem .subtitle,
            .searchItem .duration {
                color: #7f8da3;
                font-size: 0.78rem;
            }

            .searchItem .subtitle {
                margin-top: 3px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .searchItem .duration {
                font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            }

        .searchHint,
        .queueEmpty {
            padding: 18px;
            color: #728198;
            text-align: center;
            font-size: 0.8rem;
        }

        #queuePanel {
            display: none;
            width: auto;
            min-width: 0;
            overflow: hidden;
            border-radius: 22px;
        }

            #queuePanel.visible {
                display: block;
            }

        #queueHeader {
            padding: 16px 17px;
            background: rgba(255, 255, 255, 0.035);
            border-bottom: 1px solid var(--line);
            color: #b5c2d3;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.13em;
        }

        #queueList {
            max-height: min(70vh, 680px);
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .queueItem {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            cursor: pointer;
            border-left: 2px solid transparent;
            transition: background 0.14s ease, border-color 0.14s ease;
        }

            .queueItem:hover {
                background: rgba(255, 255, 255, 0.035);
            }

            .queueItem.current {
                background: linear-gradient(90deg, rgba(79, 156, 249, 0.12), rgba(79, 156, 249, 0.025));
                border-left-color: var(--accent);
            }

        .queuePanel.readonly .queueItem {
            cursor: default;
        }

        #queuePanel.readonly .queueItem:hover {
            background: inherit;
        }

        .queueCover {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            object-fit: cover;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #182232;
        }

        .queueInfo {
            flex: 1;
            min-width: 0;
        }

        .queueTitle {
            color: #d9e2ed;
            font-size: 0.82rem;
            font-weight: 650;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .queueItem.current .queueTitle {
            color: #9ec9ff;
            font-weight: 700;
        }

        .queueArtist {
            margin-top: 3px;
            color: #738197;
            font-size: 0.72rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .queueIndex {
            flex-shrink: 0;
            color: #5f6d82;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.7rem;
        }

        #settingsBtn,
        #logBtn {
            position: fixed;
            top: 18px;
            z-index: 50;
            width: 42px;
            height: 42px;
            padding: 0;
            border: 1px solid var(--line);
            border-radius: 13px;
            background: rgba(18, 26, 37, 0.72);
            color: #b6c4d6;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.20), inset 0 1px rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: transform 0.16s ease, background 0.16s ease, border-color 0.16s ease, color 0.16s ease;
        }

        #settingsBtn {
            right: 18px;
            font-size: 18px;
        }

        #logBtn {
            right: 68px;
            font-size: 16px;
        }

            #settingsBtn:hover,
            #logBtn:hover {
                transform: translateY(-2px);
                background: rgba(31, 45, 63, 0.86);
                border-color: rgba(148, 163, 184, 0.28);
                color: #e0e9f5;
            }

        #settingsBtn:hover {
            transform: translateY(-2px) rotate(12deg);
        }

        #settingsModal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(2, 6, 12, 0.66);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

            #settingsModal.visible {
                display: flex;
            }

            #settingsModal .modal {
                width: min(520px, 100%);
                max-height: min(90vh, 760px);
                overflow-y: auto;
                padding: 26px;
                border: 1px solid rgba(148, 163, 184, 0.18);
                border-radius: 20px;
                background: linear-gradient(180deg, rgba(31, 43, 59, 0.90), rgba(13, 20, 30, 0.92));
                box-shadow: 0 30px 90px rgba(0, 0, 0, 0.48), inset 0 1px rgba(255, 255, 255, 0.06);
                backdrop-filter: blur(24px) saturate(150%);
                -webkit-backdrop-filter: blur(24px) saturate(150%);
            }

            #settingsModal h2 {
                margin: 0 0 20px;
                color: #f0f5fb;
                font-size: 1.35rem;
                letter-spacing: -0.02em;
            }

        .field {
            margin-bottom: 16px;
        }

            .field label {
                display: block;
                margin-bottom: 7px;
                color: #bcc8d8;
                font-size: 0.78rem;
                font-weight: 700;
            }

            .field input {
                width: 100%;
                height: 44px;
                padding: 0 12px;
                color: var(--text);
                background: rgba(5, 10, 17, 0.44);
                border: 1px solid var(--line-strong);
                border-radius: 11px;
                outline: none;
                font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
                font-size: 0.78rem;
                transition: border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
            }

            .field .hint {
                margin-top: 6px;
                color: #718098;
                font-size: 0.71rem;
                line-height: 1.45;
            }

            .field code {
                color: #9fcaff;
            }

        #oauthLoginBtn {
            width: 100%;
            min-height: 44px;
            margin-bottom: 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 11px;
            background: rgba(255, 255, 255, 0.055);
            color: #edf3f9;
            font-size: 0.83rem;
            font-weight: 650;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
        }

            #oauthLoginBtn:hover {
                transform: translateY(-1px);
                background: rgba(255, 255, 255, 0.09);
                border-color: rgba(255, 255, 255, 0.13);
            }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid var(--line);
        }

            .modal-actions button {
                min-width: 104px;
            }

        #settingsCancelBtn {
            background: transparent;
        }

        #settingsSaveBtn {
            border-color: rgba(122, 183, 255, 0.34);
            background: linear-gradient(180deg, rgba(79, 156, 249, 0.90), rgba(57, 123, 205, 0.88));
            color: #f6fbff;
        }

            #settingsSaveBtn:hover {
                background: linear-gradient(180deg, rgba(91, 166, 255, 0.96), rgba(61, 130, 216, 0.93));
            }

        @media (max-width: 900px) {
            body {
                padding: 18px;
            }

            #layout {
                grid-template-columns: 1fr;
            }

            #queuePanel {
                width: 100%;
            }

            #queueList {
                max-height: 320px;
            }
        }

        @media (max-width: 620px) {
            body {
                padding: 12px;
            }

            #mainColumn {
                padding: 18px;
                border-radius: 18px;
            }

            #settingsBtn,
            #logBtn {
                top: 12px;
            }

            #settingsBtn {
                right: 12px;
            }

            #logBtn {
                right: 62px;
            }

            #searchModeToggle {
                width: 100%;
            }

                #searchModeToggle button {
                    flex: 1;
                }

            .controls input[type="text"] {
                min-width: 100%;
            }

            #searchRow .controls button {
                flex: 1;
            }

            #seekRow {
                gap: 8px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <button id="settingsBtn" title="Настройки" aria-label="Настройки">⚙️</button>
    <button id="logBtn" title="Открыть папку с логами" aria-label="Открыть папку с логами">📝</button>

    <div id="layout">
        <div id="mainColumn">
            <h1>Sync Player <span id="hostBadge">—</span></h1>
            <p id="status">Ожидание подключения...</p>

            <button id="transferHostBtn" title="Сделать партнёра хостом">👑 Передать хост</button>

            <div id="trackInfo">
                <div id="trackTitle">Трек не загружен</div>
                <div id="trackQueue" style="font-size:0.85em; color:#667; font-family:monospace; margin-top:4px;"></div>
            </div>

            <div id="seekRow">
                <span id="timeCurrent">0:00</span>
                <input type="range" id="seekBar" min="0" max="1" step="0.01" value="0" disabled />
                <span id="timeTotal">0:00</span>
            </div>

            <div id="volumeRow" style="display:none;">
                <button id="muteBtn" title="Mute">🔊</button>
                <input type="range" id="volumeBar" min="0" max="1" step="0.01" value="1" />
                <span id="volumeLabel">100%</span>
            </div>

            <div class="controls" id="searchRow">
                <div id="searchModeToggle" title="Что искать в первую очередь">
                    <button id="modeArtistBtn" class="active">🎤 Исполнитель</button>
                    <button id="modeTracksBtn">🎵 Треки</button>
                </div>
                <input id="searchInput" type="text" placeholder="Название трека или исполнитель..." />
                <button id="searchBtn">Найти</button>
                <button id="waveBtn" title="Запустить Яндекс Волну">🌊 Волна</button>
            </div>
            <div id="searchResults"></div>

            <div class="controls" id="playRow">
                <button id="prevBtn" title="Предыдущий (←)">⏮</button>
                <button id="playBtn">▶</button>
                <button id="pauseBtn">⏸</button>
                <button id="nextBtn" title="Следующий (→)">⏭</button>
            </div>
        </div>

        <div id="queuePanel">
            <div id="queueHeader">Очередь</div>
            <div id="queueList"></div>
        </div>
    </div>

    <div id="settingsModal">
        <div class="modal">
            <h2>Настройки</h2>

            <div class="field">
                <label>Токен Яндекс.Музыки</label>
                <input type="password" id="ymTokenInput" placeholder="Вставьте ваш токен" />
                <div class="hint">Или нажмите кнопку ниже для авторизации через Яндекс</div>
            </div>

            <button id="oauthLoginBtn">Войти через Яндекс</button>

            <div class="field">
                <label>UID (ID пользователя)</label>
                <input type="text" id="ymUidInput" placeholder="Например: 123456789" />
                <div class="hint">Если не знаешь — попробуй <code>1</code>, часто работает</div>
            </div>

            <div class="field">
                <label>Адрес Signaling-сервера</label>
                <input type="text" id="signalingUrlInput" placeholder="ws://localhost:8080" />
                <div class="hint">Для друга через интернет — <code>wss://...trycloudflare.com</code></div>
            </div>

            <div class="field">
                <label>Название комнаты</label>
                <input type="text" id="roomNameInput" placeholder="test-room-1" />
                <div class="hint">Вы с другом должны ввести одинаковое имя</div>
            </div>

            <div class="modal-actions">
                <button id="settingsCancelBtn">Отмена</button>
                <button id="settingsSaveBtn">Сохранить</button>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
