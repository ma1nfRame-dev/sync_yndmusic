<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sync Player</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            padding: 20px;
            max-width: 750px;
            margin: 0 auto;
        }

        #trackInfo {
            font-size: 1.05em;
            margin: 10px 0;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 6px;
            min-height: 1.4em;
        }

        .controls {
            margin: 15px 0;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

            .controls input[type="text"] {
                flex: 1;
                min-width: 300px;
                padding: 8px;
                font-size: 14px;
            }

            .controls button {
                padding: 8px 16px;
                font-size: 14px;
                cursor: pointer;
            }

        #status {
            color: #666;
            font-size: 0.9em;
        }

        #searchRow {
            display: none;
        }

            #searchRow.visible {
                display: flex;
            }

        #playRow {
            display: none;
        }

            #playRow.visible {
                display: flex;
            }

        /* Прогресс-бар */
        #seekRow {
            display: none;
            align-items: center;
            gap: 12px;
            margin: 15px 0;
            font-family: monospace;
            font-size: 0.95em;
        }

            #seekRow.visible {
                display: flex;
            }

        #seekBar {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            background: #ddd;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

            #seekBar::-webkit-slider-thumb {
                -webkit-appearance: none;
                width: 16px;
                height: 16px;
                border-radius: 50%;
                background: #1e88e5;
                cursor: pointer;
                transition: transform 0.1s;
            }

                #seekBar::-webkit-slider-thumb:hover {
                    transform: scale(1.2);
                }

            #seekBar:disabled {
                cursor: not-allowed;
                opacity: 0.5;
            }

        /* Результаты поиска */
        #searchResults {
            display: none;
            max-height: 360px;
            overflow-y: auto;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #fff;
        }

            #searchResults.visible {
                display: block;
            }

        .searchItem {
            display: flex;
            gap: 12px;
            padding: 8px 10px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            align-items: center;
        }

            .searchItem:last-child {
                border-bottom: none;
            }

            .searchItem:hover {
                background: #f5f7fa;
            }

            .searchItem img {
                width: 48px;
                height: 48px;
                border-radius: 4px;
                object-fit: cover;
                flex-shrink: 0;
                background: #eee;
            }

            .searchItem .info {
                flex: 1;
                min-width: 0;
            }

            .searchItem .title {
                font-weight: 600;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .searchItem .subtitle {
                font-size: 0.85em;
                color: #666;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .searchItem .duration {
                font-family: monospace;
                color: #666;
                font-size: 0.85em;
            }

        .searchHint {
            padding: 12px;
            color: #888;
            text-align: center;
            font-size: 0.9em;
        }
        #volumeRow {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 10px 0 15px 0;
            font-family: monospace;
            font-size: 0.9em;
        }

            #volumeRow button {
                background: none;
                border: none;
                font-size: 20px;
                cursor: pointer;
                padding: 4px;
                width: 36px;
                height: 36px;
                border-radius: 50%;
                transition: background 0.15s;
            }

                #volumeRow button:hover {
                    background: #eee;
                }

        #volumeBar {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 5px;
            background: #ddd;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

            #volumeBar::-webkit-slider-thumb {
                -webkit-appearance: none;
                width: 14px;
                height: 14px;
                border-radius: 50%;
                background: #333;
                cursor: pointer;
                transition: transform 0.1s;
            }

                #volumeBar::-webkit-slider-thumb:hover {
                    transform: scale(1.2);
                }

        #volumeLabel {
            min-width: 45px;
            text-align: right;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>Sync Player</h1>
    <p id="status">Ожидание подключения...</p>
    <div id="trackInfo">Трек не загружен</div>

    <!-- Прогресс-бар -->
    <div id="seekRow">
        <span id="timeCurrent">0:00</span>
        <input type="range" id="seekBar" min="0" max="1" step="0.01" value="0" disabled />
        <span id="timeTotal">0:00</span>
    </div>

    <!-- Громкость -->
    <div id="volumeRow">
        <button id="muteBtn" title="Mute">🔊</button>
        <input type="range" id="volumeBar" min="0" max="1" step="0.01" value="1" />
        <span id="volumeLabel">100%</span>
    </div>

    <div class="controls" id="searchRow">
        <input id="searchInput" type="text" placeholder="Название трека или исполнитель..." />
        <button id="searchBtn">Найти</button>
        <button id="waveBtn" title="Запустить Яндекс Волну">🌊 Волна</button>
    </div>
    <div id="searchResults"></div>

    <div class="controls" id="playRow">
        <button id="playBtn">Play</button>
        <button id="pauseBtn">Pause</button>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
